name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  ACTON_VERSION: "1.1.0"
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust and generated files
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'xtask/Cargo.toml', 'xtask/src/**/*.rs') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            cargo-${{ runner.os }}-

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check Rust
        run: cargo check --workspace --all-targets --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --all-features --locked

      - name: Check JSON Schemas
        run: cargo xtask schema --check

  acton-quality:
    name: ABI catalog and Tolk quality
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Acton
        uses: ton-blockchain/setup-acton@2d38fd579e1bf8753a3e0cff9ad695612b98a676 # v1.0.0
        with:
          version: ${{ env.ACTON_VERSION }}

      - name: Install Acton standard library
        run: acton init --stdlib-only

      - name: Restore Cargo cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'xtask/Cargo.toml', 'xtask/src/**/*.rs') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            cargo-${{ runner.os }}-

      - name: Restore Acton cache
        id: acton-cache
        uses: actions/cache/restore@v4
        with:
          path: build/cache/
          key: acton-${{ runner.os }}-${{ env.ACTON_VERSION }}-quality-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            acton-${{ runner.os }}-${{ env.ACTON_VERSION }}-quality-
            acton-${{ runner.os }}-${{ env.ACTON_VERSION }}-

      - name: Build ABI catalog
        run: cargo xtask bundle --pretty

      - name: Check Tolk formatting
        run: acton fmt --check

      - name: Lint Tolk
        run: acton check --output-format github

      - name: Build contracts
        run: acton run compile-all-contracts

      - name: Save Acton cache
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: build/cache/
          key: ${{ steps.acton-cache.outputs.cache-primary-key }}

  acton-tests:
    name: Tolk tests (shard ${{ matrix.shard }}/4)
    needs: acton-quality
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Acton
        uses: ton-blockchain/setup-acton@2d38fd579e1bf8753a3e0cff9ad695612b98a676 # v1.0.0
        with:
          version: ${{ env.ACTON_VERSION }}

      - name: Install Acton standard library
        run: acton init --stdlib-only

      - name: Restore Acton cache
        id: acton-cache
        uses: actions/cache/restore@v4
        with:
          path: build/cache/
          key: acton-${{ runner.os }}-${{ env.ACTON_VERSION }}-tests-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            acton-${{ runner.os }}-${{ env.ACTON_VERSION }}-tests-${{ matrix.shard }}-
            acton-${{ runner.os }}-${{ env.ACTON_VERSION }}-quality-
            acton-${{ runner.os }}-${{ env.ACTON_VERSION }}-

      - name: Run Tolk test shard
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_API_KEY }}
        run: acton run run-test-shard-${{ matrix.shard }}

      - name: Save Acton cache
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: build/cache/
          key: ${{ steps.acton-cache.outputs.cache-primary-key }}
