name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: { }

env:
  ACTON_VERSION: "trunk"
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust and generated files
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: workspace
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check Rust
        run: cargo check --workspace --all-targets --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --all-features --locked

      - name: Check JSON Schemas
        run: cargo xtask schema --check

  acton-quality:
    name: ABI catalog and Tolk quality
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Acton
        uses: ton-blockchain/setup-acton@2d38fd579e1bf8753a3e0cff9ad695612b98a676 # v1.0.0
        with:
          version: ${{ env.ACTON_VERSION }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: workspace
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Cache Acton
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .acton/
            build/cache/
          key: acton-${{ runner.os }}-${{ env.ACTON_VERSION }}-quality-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build contracts
        run: acton build

      - name: Check generated wrappers
        run: cargo xtask wrappers --check

      - name: Build ABI catalog
        run: cargo xtask bundle --pretty

      - name: Check Tolk formatting
        run: acton fmt --check

      - name: Lint Tolk
        run: acton check --output-format github

  acton-tests:
    name: Tolk tests (shard ${{ matrix.shard }}/4)
    needs: acton-quality
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read

    env:
      TONCENTER_MAINNET_API_KEY: ${{ secrets.TONCENTER_API_KEY }}

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [ 1, 2, 3, 4 ]

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Acton
        uses: ton-blockchain/setup-acton@2d38fd579e1bf8753a3e0cff9ad695612b98a676 # v1.0.0
        with:
          version: ${{ env.ACTON_VERSION }}

      - name: Cache Acton
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .acton/
            build/cache/
          key: acton-${{ runner.os }}-${{ env.ACTON_VERSION }}-tests-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            acton-${{ runner.os }}-${{ env.ACTON_VERSION }}-quality-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build contracts
        run: acton build

      - name: Run Tolk test shard
        run: acton run run-test-shard-${{ matrix.shard }}
